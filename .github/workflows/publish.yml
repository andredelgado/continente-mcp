name: Publish

# Draft a GitHub release for tag vX.Y.Z and publish it; this workflow then releases the
# same version to npm, attaches the Claude Desktop extension and lists it in the MCP
# Registry. Prereleases go to npm "next" and are not listed.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  npm:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or newer.
      - run: npm install --global npm@11
      - run: npm ci
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          if [ "$TAG" != "v$version" ] || [ "$lock" != "$version" ]; then
            echo "::error::Tag $TAG, package.json $version and package-lock.json $lock must agree."
            exit 1
          fi
      # Makes re-running a release safe; npm never accepts the same version twice.
      - name: Skip versions already on npm
        id: registry
        run: |
          spec=$(node -p "const p = require('./package.json'); p.name + '@' + p.version")
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$spec is already on npm; nothing to publish."
          fi
      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}

  extension:
    name: Attach Claude Desktop extension
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:bundle
      - name: Upload continente-mcp.mcpb to the release
        run: gh release upload "$TAG" build/continente-mcp.mcpb --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}

  registry:
    name: List in the MCP Registry
    needs: [npm, extension]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      PUBLISHER_VERSION: '1.8.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The registry checks mcpName in the published package, which npm can take minutes to serve.
      - name: Wait for the npm release
        run: |
          name=$(jq -r .name package.json); version=${TAG#v}; expected=$(jq -r .mcpName package.json)
          for attempt in $(seq 1 40); do
            if [ "$(npm view "$name@$version" mcpName 2>/dev/null)" = "$expected" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::$name@$version with mcpName $expected did not appear on npm in time."
          exit 1
      - name: Fill in the version and the extension checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          gh release download "$TAG" --pattern continente-mcp.mcpb --repo "$GITHUB_REPOSITORY"
          sha=$(sha256sum continente-mcp.mcpb | cut -d' ' -f1)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/continente-mcp.mcpb"
          jq --arg v "$version" --arg sha "$sha" --arg url "$url" '.version = $v | .packages |= map(
            if .registryType == "npm" then .version = $v
            elif .registryType == "mcpb" then .identifier = $url | .fileSha256 = $sha
            else . end)' server.json > server.tmp && mv server.tmp server.json
      - name: Skip versions already listed
        id: listed
        run: |
          name=$(jq -r .name server.json | sed 's#/#%2F#g')
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/$name/versions/${TAG#v}")
          if [ "$status" = 200 ]; then echo "listed=true" >> "$GITHUB_OUTPUT"; echo "::notice::${TAG#v} is already in the MCP Registry."; fi
      - name: Install mcp-publisher
        if: steps.listed.outputs.listed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$PUBLISHER_VERSION" --repo modelcontextprotocol/registry \
            --pattern mcp-publisher_linux_amd64.tar.gz --pattern "registry_${PUBLISHER_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "registry_${PUBLISHER_VERSION}_checksums.txt"
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Publish to the MCP Registry
        if: steps.listed.outputs.listed != 'true'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
