name: Publish

# Draft a GitHub release for tag vX.Y.Z and publish it; this workflow then releases the
# same version to npm, attaches the Claude Desktop extension, pushes the Docker image to
# ghcr.io and lists it in the MCP Registry. Prereleases go to npm "next", get only their own
# image tag, and are not listed.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  npm:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or newer.
      - run: npm install --global npm@11
      - run: npm ci
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          if [ "$TAG" != "v$version" ] || [ "$lock" != "$version" ]; then
            echo "::error::Tag $TAG, package.json $version and package-lock.json $lock must agree."
            exit 1
          fi
      # Makes re-running a release safe; npm never accepts the same version twice.
      - name: Skip versions already on npm
        id: registry
        run: |
          spec=$(node -p "const p = require('./package.json'); p.name + '@' + p.version")
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$spec is already on npm; nothing to publish."
          fi
      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}

  extension:
    name: Attach Claude Desktop extension
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:bundle
      - name: Upload continente-mcp.mcpb to the release
        run: gh release upload "$TAG" build/continente-mcp.mcpb --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}

  docker:
    name: Publish the Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      # X.Y.Z always; X.Y and latest only for a stable release, so a prerelease never becomes the default.
      - name: Choose the image tags
        id: image
        run: |
          version=${TAG#v}
          if [ "$version" != "$(node -p "require('./package.json').version")" ]; then
            echo "::error::Tag $TAG does not match package.json."; exit 1
          fi
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tags="$image:$version"
          if [ "$PRERELEASE" != true ]; then tags="$tags,$image:${version%.*},$image:latest"; fi
          { echo "image=$image"; echo "version=$version"; echo "tags=$tags"; } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Makes re-running a release safe: a published version is never replaced.
      - name: Skip versions already published
        id: published
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE:$VERSION is already published; nothing to push."
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.published.outputs.published != 'true'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.published.outputs.published != 'true'
      # The image that is checked is built from the same cache as the one pushed next.
      - name: Build the image to check
        if: steps.published.outputs.published != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: continente-mcp:smoke
          cache-to: type=gha,mode=max
      - name: Check it starts and lists every tool
        if: steps.published.outputs.published != 'true'
        run: npm run test:docker
      - name: Build and push for amd64 and arm64
        if: steps.published.outputs.published != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=MCP server for Continente.pt
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.licenses=MIT
            index:org.opencontainers.image.description=MCP server for Continente.pt

  registry:
    name: List in the MCP Registry
    needs: [npm, extension, docker]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      PUBLISHER_VERSION: '1.8.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The registry checks mcpName in the published package, which npm can take minutes to serve.
      - name: Wait for the npm release
        run: |
          name=$(jq -r .name package.json); version=${TAG#v}; expected=$(jq -r .mcpName package.json)
          for attempt in $(seq 1 40); do
            if [ "$(npm view "$name@$version" mcpName 2>/dev/null)" = "$expected" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::$name@$version with mcpName $expected did not appear on npm in time."
          exit 1
      - name: Fill in the version, the extension checksum and the image tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          gh release download "$TAG" --pattern continente-mcp.mcpb --repo "$GITHUB_REPOSITORY"
          sha=$(sha256sum continente-mcp.mcpb | cut -d' ' -f1)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/continente-mcp.mcpb"
          jq --arg v "$version" --arg sha "$sha" --arg url "$url" '.version = $v | .packages |= map(
            if .registryType == "npm" then .version = $v
            elif .registryType == "mcpb" then .identifier = $url | .fileSha256 = $sha
            elif .registryType == "oci" then .identifier |= sub(":[^:/]+$"; ":" + $v)
            else . end)' server.json > server.tmp && mv server.tmp server.json
      - name: Skip versions already listed
        id: listed
        run: |
          name=$(jq -r .name server.json | sed 's#/#%2F#g')
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/$name/versions/${TAG#v}")
          if [ "$status" = 200 ]; then echo "listed=true" >> "$GITHUB_OUTPUT"; echo "::notice::${TAG#v} is already in the MCP Registry."; fi
      - name: Install mcp-publisher
        if: steps.listed.outputs.listed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$PUBLISHER_VERSION" --repo modelcontextprotocol/registry \
            --pattern mcp-publisher_linux_amd64.tar.gz --pattern "registry_${PUBLISHER_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "registry_${PUBLISHER_VERSION}_checksums.txt"
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Publish to the MCP Registry
        if: steps.listed.outputs.listed != 'true'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
